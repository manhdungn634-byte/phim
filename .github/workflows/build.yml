name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'phim-android.zip'
      - '.github/workflows/build.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: |
          mkdir work
          unzip -q phim-android.zip -d work
          cd work
          gradle --no-daemon assembleDebug
      - name: Collect APK
        run: cp work/app/build/outputs/apk/debug/app-debug.apk Phim-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Phim-TV-apk
          path: Phim-TV.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Phim TV APK
          files: Phim-TV.apk
