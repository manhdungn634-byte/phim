<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>Phim</title>
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phim">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://phimapi.com"><link rel="preconnect" href="https://phimimg.com">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#1a1e29;--tx:#f2f4f8;--mu:#9aa3b5;--ac:#e50914;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Roboto,Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 4vw;position:absolute;top:0;left:0;right:0;z-index:5}
.logo{font-size:28px;font-weight:800;color:var(--ac);letter-spacing:1px}
button{font:inherit;color:var(--tx);background:#ffffff22;border:0;border-radius:8px;padding:10px 20px;cursor:pointer}
.f:focus,button:focus,input:focus{outline:3px solid #fff;transform:scale(1.06);z-index:3}
.hero{position:relative;height:56vh;min-height:300px;display:flex;align-items:flex-end;padding:0 4vw 28px;background-size:cover;background-position:center top}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg),#0b0d1255 60%,#0b0d1299)}
.hero>div{position:relative;z-index:2;max-width:640px}
.hero h1{margin:0 0 8px;font-size:clamp(26px,4vw,48px)}.hero p{color:var(--mu);margin:0 0 16px}
.hero button.p{background:var(--ac);font-weight:700}
h2{margin:18px 4vw 8px;font-size:20px}
.row{display:flex;gap:14px;overflow-x:auto;padding:8px 4vw 14px;scrollbar-width:none}
.card{flex:0 0 auto;width:150px;aspect-ratio:2/3;border-radius:10px;background:var(--card) center/cover;position:relative;overflow:hidden;transition:transform .12s}
.card span{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 8px;font-size:13px;background:linear-gradient(0deg,#000d,transparent)}
.bar{position:absolute;left:0;bottom:0;height:4px;background:var(--ac)}
.note{margin:4px 4vw;color:var(--mu);font-size:13px}
#set,#pl{position:fixed;inset:0;background:#000d;display:none;z-index:9;align-items:center;justify-content:center}
#set.on,#pl.on{display:flex}
.box{background:var(--card);padding:24px;border-radius:14px;width:min(560px,92vw);display:grid;gap:10px}
.box label{color:var(--mu);font-size:13px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #444;background:#0b0d12;color:var(--tx);font:inherit}
#pl{background:var(--bg);flex-direction:column;align-items:stretch;justify-content:flex-start}#vb{position:relative;background:#000;height:min(56.25vw,54vh);min-height:200px;flex:0 0 auto}video,#fr{width:100%;height:100%;background:#000;display:block}#sp{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:20px;pointer-events:none;z-index:2}#sp.on{display:flex}#ov{position:absolute;inset:0;background:linear-gradient(#000b,transparent 30%,transparent 55%,#000c);opacity:0;transition:opacity .2s;pointer-events:none;z-index:3}#ov.on{opacity:1}#ov.on button,#ov.on #pb{pointer-events:auto}#tp{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:8px 12px}#ti{flex:1;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:22px;pointer-events:none}.cb{width:56px;height:56px;border-radius:50%;font-size:16px;padding:0}.cb.big{width:72px;height:72px;font-size:28px;background:var(--ac)}#bt{position:absolute;left:0;right:0;bottom:0;padding:8px 14px}#pb{height:12px;border-radius:6px;background:#ffffff44;cursor:pointer}#pf{display:block;height:100%;width:0;background:var(--ac);border-radius:6px}#qm{display:none;position:absolute;top:50px;right:12px;background:#111e;border-radius:10px;padding:6px;flex-direction:column;gap:4px;z-index:4;max-height:70%;overflow:auto}#qm.on{display:flex}.q{text-align:left;background:transparent}.q.cur,.e.cur{background:var(--ac)}#pn{flex:1;overflow-y:auto;padding:14px 4vw 40px}#pn h3{margin:16px 0 8px;font-size:17px}.ds{color:var(--mu);font-size:14px;line-height:1.5;margin:0 0 10px}#eps{display:flex;flex-wrap:wrap;gap:8px}.e{background:#ffffff22;padding:8px 14px}#pn .row{padding:8px 0 14px}</style></head><body>
<header><div class="logo">PHIM</div><button class="f" id="gear">⚙ API</button></header>
<section class="hero" id="hero"></section>
<div class="note" id="msg"></div>
<h2>Đang xem</h2><div class="row" id="watch"></div>
<h2>Phim mới nhất</h2><div class="row" id="latest"></div>
<h2>Phim nổi bật</h2><div class="row" id="feat"></div>

<div id="set"><div class="box">
<h3 style="margin:0">Cài đặt API</h3>
<label>Địa chỉ API</label><input id="api" placeholder="https://phimapi.com">
<label>Đường dẫn danh sách phim mới</label><input id="path" placeholder="/danh-sach/phim-moi-cap-nhat?page=1">
<label>Tiền tố ảnh (nếu poster là đường dẫn tương đối)</label><input id="img" placeholder="https://phimimg.com/">
<div style="display:flex;gap:10px"><button class="f" id="save">Lưu &amp; tải</button><button class="f" id="close">Đóng</button></div>
</div></div>
<div id="pl"><div id="vb"><video id="v" autoplay playsinline></video><iframe id="fr" allowfullscreen allow="autoplay; fullscreen" style="display:none;border:0"></iframe><div id="sp">Đang tải…</div>
<div id="ov"><div id="tp"><div id="ti"></div><button class="f" id="qb">⚙ Tự động</button><button class="f" id="bx">✕</button></div>
<div class="cc"><button class="f cb" id="bb">↺10</button><button class="f cb big" id="bp">▶</button><button class="f cb" id="bf">10↻</button></div>
<div id="bt"><div id="pb" class="f" tabindex="0"><i id="pf"></i></div><div id="tm" class="note" style="margin:6px 0 0"></div></div></div>
<div id="qm"></div></div><div id="pn"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const S={api:'https://phimapi.com',path:'/danh-sach/phim-moi-cap-nhat?page=1',img:'https://phimimg.com/'};
let watching=[],hls=null,cur=null;
try{Object.assign(S,JSON.parse(localStorage.getItem('phim_cfg')||'{}'));watching=JSON.parse(localStorage.getItem('phim_watch')||'[]')}catch(e){}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bg=u=>u?`background-image:url('${esc(u)}')`:'';
const demo=[...Array(12)].map((_,i)=>({name:'Phim mẫu '+(i+1),slug:'demo'+i,year:2026,poster:'',demo:1}));
let PI='';function imgUrl(p){if(!p)return'';if(/^https?:/.test(p))return p;if(PI&&!/\//.test(p))return PI+p;return S.img+p.replace(/^\//,'')}
function norm(j){PI=j.pathImage||'';const a=j.items||(j.data&&j.data.items)||j.data||[];
 return(Array.isArray(a)?a:[]).map(x=>({name:x.name||x.title,slug:x.slug,year:x.year,poster:imgUrl(x.poster_url||x.thumb_url||x.poster)}))}
function card(m,pct){const hue=(m.slug||'').length*37%360;
 return`<div class="card f" tabindex="0" data-s="${esc(m.slug)}" style="${m.poster?bg(m.poster):`background-image:linear-gradient(160deg,hsl(${hue} 50% 30%),#111)`}"><span>${esc(m.name)}</span>${pct?`<i class="bar" style="width:${pct}%"></i>`:''}</div>`}
function render(list){
 window.L=list;
 const h=list[0]||{};
 $('hero').style=bg(h.poster);
 $('hero').innerHTML=`<div><h1>${esc(h.name)}</h1><p>${h.year?esc(h.year)+' · ':''}Phim nổi bật hôm nay</p><button class="f p" tabindex="0" data-s="${esc(h.slug)}">▶ Xem ngay</button></div>`;
 $('latest').innerHTML=list.map(m=>card(m)).join('');
 $('feat').innerHTML=list.slice(0,6).reverse().map(m=>card(m)).join('');
 renderWatch();
}
function renderWatch(){
 $('watch').innerHTML=watching.length?watching.map(m=>card(m,m.pct)).join(''):'<div class="note">Chưa có phim đang xem.</div>';
}
async function load(){
 if(!S.api){render(demo);$('msg').textContent='Đang hiển thị dữ liệu mẫu. Bấm “⚙ API” để nhập API phim của bạn.';return}
 try{const c=JSON.parse(localStorage.getItem('phim_list')||'null');if(c&&c.k===S.api+S.path)render(c.l)}catch(e){}
 $('msg').textContent='Đang tải…';
 try{const r=await fetch(S.api.replace(/\/$/,'')+S.path);const l=norm(await r.json());
  if(!l.length)throw 0;render(l);$('msg').textContent='';try{localStorage.setItem('phim_list',JSON.stringify({k:S.api+S.path,l}))}catch(e){}}
 catch(e){if(!window.L)render(demo);$('msg').textContent='Không tải được API. Kiểm tra địa chỉ rồi thử lại.'}
}
const DC={};let pt=null;
function detail(slug){return DC[slug]||(DC[slug]=fetch(S.api.replace(/\/$/,'')+'/phim/'+encodeURIComponent(slug)).then(r=>r.json()).catch(e=>{delete DC[slug];throw e}))}
document.addEventListener('focusin',e=>{const s=e.target.dataset&&e.target.dataset.s;if(s&&S.api&&!s.startsWith('demo')){clearTimeout(pt);pt=setTimeout(()=>detail(s).catch(()=>{}),250)}});
let P=null,ht=null;
const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const plOn=()=>$('pl').classList.contains('on');
const txt=s=>{try{return(new DOMParser().parseFromString(s||'','text/html').body.textContent||'').trim()}catch(e){return''}};
function show(){const o=$('ov');o.classList.add('on');clearTimeout(ht);ht=setTimeout(()=>{if(!$('qm').classList.contains('on'))o.classList.remove('on')},4000)}
function icon(){$('bp').textContent=$('v').paused?'▶':'⏸'}
function save(){const v=$('v');if(!P)return;
 watching=[{slug:P.m.slug,name:P.info.name,poster:P.m.poster,year:P.info.year,i:P.i,t:v.currentTime||0,pct:v.duration?Math.round(v.currentTime/v.duration*100):0},...watching.filter(x=>x.slug!==P.m.slug)].slice(0,20);
 try{localStorage.setItem('phim_watch',JSON.stringify(watching))}catch(e){}}
function renderInfo(){const i=P.info;
 $('pn').innerHTML=`<h2 style="margin:0 0 4px">${esc(i.name)}</h2><div class="note" style="margin:0 0 6px">${esc([i.org,i.year,i.q,i.lang,i.time,i.cur].filter(Boolean).join(' · '))}</div>`
 +(i.cats?`<div class="note" style="margin:0 0 8px">${esc(i.cats)}</div>`:'')+`<p class="ds">${esc(i.content||'Chưa có nội dung phim.')}</p>`
 +(i.actors?`<div class="note" style="margin:0 0 6px">Diễn viên: ${esc(i.actors)}</div>`:'')+`<h3>Tập phim</h3><div id="eps"></div><h3>Phim khác</h3><div class="row" id="rel"></div>`;
 $('rel').innerHTML=(window.L||[]).filter(x=>x.slug!==P.m.slug).slice(0,20).map(m=>card(m)).join('')}
function buildEps(){$('eps').innerHTML=P.eps.map((e,i)=>`<button class="f e${i===P.i?' cur':''}" data-i="${i}">${esc(e.n)}</button>`).join('')}
function buildQ(){const m=$('qm'),ok=hls&&hls.levels&&hls.levels.length>1;
 let h=`<button class="f q${P.q===-1?' cur':''}" data-q="-1">Tự động</button>`;
 if(ok)h+=hls.levels.map((l,i)=>({i,h:l.height||0})).sort((a,b)=>b.h-a.h).map(o=>`<button class="f q${P.q===o.i?' cur':''}" data-q="${o.i}">${o.h?o.h+'p':'Mức '+(o.i+1)}</button>`).join('');
 m.innerHTML=h;$('qb').textContent='⚙ '+(P.q===-1||!ok?'Tự động':(hls.levels[P.q].height||'?')+'p')}
function closeQ(){$('qm').classList.remove('on')}
function fail(){if(!P)return;const e=P.eps[P.i],v=$('v');clearTimeout(P.to);
 if(!P.nat&&e.u){P.nat=1;if(hls){hls.destroy();hls=null}v.src=e.u;v.load();v.play().catch(()=>{});buildQ();P.to=setTimeout(fail,12000);return}
 $('sp').classList.remove('on');
 if(e.e){v.pause();v.style.display='none';$('fr').style.display='block';$('fr').src=e.e}else $('ti').textContent='Không phát được tập này';show()}
function ep(i,t){
 P.i=i;P.nat=0;P.rec=0;P.q=-1;const e=P.eps[i],v=$('v'),fr=$('fr');
 if(hls){hls.destroy();hls=null}
 v.pause();closeQ();$('sp').classList.add('on');clearTimeout(P.to);P.to=setTimeout(fail,15000);
 $('ti').textContent=P.info.name+' — '+e.n;buildEps();buildQ();show();
 if(!e.u){clearTimeout(P.to);v.style.display='none';fr.style.display='block';fr.src=e.e||'';$('sp').classList.remove('on');return}
 fr.style.display='none';fr.src='';v.style.display='block';
 const go=()=>{if(t)v.currentTime=t;v.play().catch(()=>{$('sp').classList.remove('on');$('ti').textContent=P.info.name+' — '+e.n+' (chạm ▶ để phát)';show()})};
 if(window.Hls&&Hls.isSupported()){hls=new Hls({startFragPrefetch:true,capLevelToPlayerSize:false,maxBufferLength:20,backBufferLength:30,manifestLoadingMaxRetry:3,fragLoadingMaxRetry:4});
  hls.loadSource(e.u);hls.attachMedia(v);
  hls.on(Hls.Events.MANIFEST_PARSED,()=>{buildQ();go()});
  hls.on(Hls.Events.ERROR,(_,d)=>{if(!d.fatal)return;if(d.type==='mediaError'&&!P.rec){P.rec=1;hls.recoverMediaError()}else fail()})}
 else{v.src=e.u;v.onloadedmetadata=go;v.onerror=fail}
}
async function play(slug){
 if(String(slug).startsWith('demo')){$('msg').textContent='Đây là phim mẫu. Hãy nhập API để xem phim thật.';return}
 if(P)save();
 const m=(window.L||[]).find(x=>x.slug===slug)||watching.find(x=>x.slug===slug)||{slug,name:slug};
 const old=watching.find(x=>x.slug===slug);
 document.activeElement&&document.activeElement.blur();
 if(P)clearTimeout(P.to);P=null;$('v').pause();closeQ();$('pn').scrollTop=0;
 $('pl').classList.add('on');$('sp').classList.add('on');
 try{const j=await detail(slug);
  const sv=j.episodes||[],eps=[];
  sv.forEach(s=>(s.server_data||[]).forEach(d=>eps.push({n:(sv.length>1?s.server_name+' · ':'')+d.name,u:d.link_m3u8,e:d.link_embed})));
  if(!eps.length)throw 0;
  const mv=j.movie||{};
  if(!m.poster&&mv.poster_url)m.poster=imgUrl(mv.poster_url);
  const info={name:mv.name||m.name,org:mv.origin_name,year:mv.year,q:mv.quality,lang:mv.lang,time:mv.time,cur:mv.episode_current,
   cats:(mv.category||[]).map(c=>c.name).join(', '),actors:(mv.actor||[]).slice(0,6).join(', '),content:txt(mv.content)};
  P={m,eps,i:0,info};const i=old&&old.i<eps.length?old.i:0;
  renderInfo();ep(i,old&&old.i===i?old.t:0);$('bp').focus();
 }catch(e){$('pl').classList.remove('on');$('sp').classList.remove('on');$('msg').textContent='Không mở được phim này ('+((e&&e.message)||'dữ liệu rỗng')+'). Thử lại hoặc kiểm tra API.';scrollTo(0,0)}
}
function stop(){const v=$('v');save();if(P)clearTimeout(P.to);v.pause();v.removeAttribute('src');$('fr').src='';if(hls){hls.destroy();hls=null}P=null;closeQ();$('sp').classList.remove('on');$('pl').classList.remove('on');renderWatch()}
(function(){const v=$('v');
 v.ontimeupdate=()=>{if(!P||!v.duration)return;$('pf').style.width=v.currentTime/v.duration*100+'%';$('tm').textContent=fmt(v.currentTime)+' / '+fmt(v.duration);if(Math.floor(v.currentTime)%5===0)save()};
 v.onplay=v.onpause=icon;
 v.onended=()=>{if(P&&P.i<P.eps.length-1)ep(P.i+1,0)};
 v.onwaiting=()=>$('sp').classList.add('on');
 v.onplaying=v.oncanplay=()=>{$('sp').classList.remove('on');if(P)clearTimeout(P.to)};
 $('pb').onclick=e=>{if(!v.duration)return;const r=$('pb').getBoundingClientRect();v.currentTime=(e.clientX-r.left)/r.width*v.duration;show()};
 $('vb').onclick=e=>{if(e.target.closest('button,#pb,#qm'))return;const o=$('ov');if(o.classList.contains('on')){o.classList.remove('on');closeQ()}else show()};
 $('vb').addEventListener('mousemove',show);
 $('bp').onclick=()=>{v.paused?v.play():v.pause();show()};
 $('bb').onclick=()=>{v.currentTime=Math.max(0,v.currentTime-10);show()};
 $('bf').onclick=()=>{v.currentTime+=10;show()};
 $('bx').onclick=stop;
 $('qb').onclick=()=>{const m=$('qm');m.classList.toggle('on');if(m.classList.contains('on')){const c=m.querySelector('.cur')||m.querySelector('.q');c&&c.focus()}show()};
 $('qm').onclick=e=>{const b=e.target.closest('.q');if(!b||!P)return;const q=+b.dataset.q;P.q=q;if(hls)hls.currentLevel=q;buildQ();closeQ();$('qb').focus();show()};
})();
document.addEventListener('click',e=>{const c=e.target.closest('[data-s]');if(c)return play(c.dataset.s);
 const b=e.target.closest('.e');if(b&&P)ep(+b.dataset.i,0)});
function nav(dir){const a=document.activeElement,q=$('qm').classList.contains('on');
 const els=[...document.querySelectorAll(q?'#qm .q':'#pl .f')].filter(x=>x.offsetParent);
 const r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
 els.forEach(x=>{if(x===a)return;const b=x.getBoundingClientRect(),dx=b.left+b.width/2-cx,dy=b.top+b.height/2-cy;
  const al=dir[0]?dx*dir[0]:dy*dir[1],off=dir[0]?Math.abs(dy):Math.abs(dx);if(al<=4)return;const s=al+off*(dir[0]?3:1.5);if(s<bs){bs=s;best=x}});
 if(best)best.focus()}
document.addEventListener('keydown',e=>{
 const k=e.key,v=$('v'),a=document.activeElement;
 if(!plOn()){if(k==='Enter'&&a&&a.tagName==='DIV'&&a.dataset.s){play(a.dataset.s);e.preventDefault()}return}
 if(!P)return;show();const inF=a&&a.closest&&a.closest('#pl .f');
 if((k==='Escape'||k==='Backspace'||e.keyCode===4)&&$('qm').classList.contains('on')){closeQ();$('qb').focus();e.stopImmediatePropagation();e.preventDefault();return}
 const dir={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[k];
 if(dir){
  if(a&&a.id==='pb'&&dir[0]){v.currentTime=Math.max(0,v.currentTime+dir[0]*10)}
  else if(inF)nav(dir);
  else if(dir[0])v.currentTime=Math.max(0,v.currentTime+dir[0]*10);
  else $('bp').focus();
  e.preventDefault();return}
 if(k==='Enter'){if(inF){if(a.tagName==='DIV')a.click();return}v.paused?v.play():v.pause();e.preventDefault()}
 else if(k===' '&&!inF){v.paused?v.play():v.pause();e.preventDefault()}
 else if(k==='MediaPlayPause'){v.paused?v.play():v.pause()}
 else if(k==='MediaRewind')v.currentTime=Math.max(0,v.currentTime-10);
 else if(k==='MediaFastForward')v.currentTime+=10;
 else if(k==='MediaTrackNext'&&P.i<P.eps.length-1)ep(P.i+1,0);
 else if(k==='MediaTrackPrevious'&&P.i>0)ep(P.i-1,0);
});
// D-pad navigation
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'||e.key==='Backspace'&&!/INPUT/.test(document.activeElement.tagName)||e.keyCode===4){
  if($('pl').classList.contains('on'))stop();else $('set').classList.remove('on');return}
 const dir={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
 if(!dir||$('pl').classList.contains('on')||/INPUT/.test(document.activeElement.tagName)&&dir[1]===0)return;
 const a=document.activeElement,root=$('set').classList.contains('on')?$('set'):document;
 const els=[...root.querySelectorAll('.f,input')].filter(x=>x.offsetParent);
 if(!els.includes(a)){els[0]&&els[0].focus();e.preventDefault();return}
 const r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
 els.forEach(x=>{if(x===a)return;const q=x.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy;
  const along=dir[0]?dx*dir[0]:dy*dir[1],off=dir[0]?Math.abs(dy):Math.abs(dx);
  if(along<=4)return;const s=along+off*(dir[0]?3:1.5);if(s<bs){bs=s;best=x}});
