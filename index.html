<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#1a1e29;--tx:#f2f4f8;--mu:#9aa3b5;--ac:#e50914;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Roboto,Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 4vw;position:absolute;top:0;left:0;right:0;z-index:5}
.logo{font-size:28px;font-weight:800;color:var(--ac);letter-spacing:1px}
button{font:inherit;color:var(--tx);background:#ffffff22;border:0;border-radius:8px;padding:10px 20px;cursor:pointer}
.f:focus,button:focus,input:focus{outline:3px solid #fff;transform:scale(1.06);z-index:3}
.hero{position:relative;height:56vh;min-height:300px;display:flex;align-items:flex-end;padding:0 4vw 28px;background-size:cover;background-position:center top}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg),#0b0d1255 60%,#0b0d1299)}
.hero>div{position:relative;z-index:2;max-width:640px}
.hero h1{margin:0 0 8px;font-size:clamp(26px,4vw,48px)}.hero p{color:var(--mu);margin:0 0 16px}
.hero button.p{background:var(--ac);font-weight:700}
h2{margin:18px 4vw 8px;font-size:20px}
.row{display:flex;gap:14px;overflow-x:auto;padding:8px 4vw 14px;scrollbar-width:none}
.card{flex:0 0 auto;width:150px;aspect-ratio:2/3;border-radius:10px;background:var(--card) center/cover;position:relative;overflow:hidden;transition:transform .12s}
.card span{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 8px;font-size:13px;background:linear-gradient(0deg,#000d,transparent)}
.bar{position:absolute;left:0;bottom:0;height:4px;background:var(--ac)}
.note{margin:4px 4vw;color:var(--mu);font-size:13px}
#set,#pl{position:fixed;inset:0;background:#000d;display:none;z-index:9;align-items:center;justify-content:center}
#set.on,#pl.on{display:flex}
.box{background:var(--card);padding:24px;border-radius:14px;width:min(560px,92vw);display:grid;gap:10px}
.box label{color:var(--mu);font-size:13px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #444;background:#0b0d12;color:var(--tx);font:inherit}
#pl{background:var(--bg);flex-direction:column;align-items:stretch;justify-content:flex-start}#vb{position:relative;background:#000;height:min(56.25vw,54vh);min-height:200px;flex:0 0 auto}video,#fr{width:100%;height:100%;background:#000;display:block}#sp{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:20px;pointer-events:none;z-index:2}#sp.on{display:flex}#ov{position:absolute;inset:0;background:linear-gradient(#000b,transparent 30%,transparent 55%,#000c);opacity:0;transition:opacity .2s;pointer-events:none;z-index:3}#ov.on{opacity:1}#ov.on button,#ov.on #pb{pointer-events:auto}#tp{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:8px 12px}#ti{flex:1;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:22px;pointer-events:none}.cb{width:56px;height:56px;border-radius:50%;font-size:16px;padding:0}.cb.big{width:72px;height:72px;font-size:28px;background:var(--ac)}#bt{position:absolute;left:0;right:0;bottom:0;padding:8px 14px}#pb{height:12px;border-radius:6px;background:#ffffff44;cursor:pointer}#pf{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left;will-change:transform;background:var(--ac);border-radius:6px}#qm{display:none;position:absolute;top:50px;right:12px;background:#111e;border-radius:10px;padding:6px;flex-direction:column;gap:4px;z-index:4;max-height:70%;overflow:auto}#qm.on{display:flex}.q{text-align:left;background:transparent}.q.cur,.e.cur{background:var(--ac)}#pn{flex:1;overflow-y:auto;padding:14px 4vw 40px}#pn h3{margin:16px 0 8px;font-size:17px}.ds{color:var(--mu);font-size:14px;line-height:1.5;margin:0 0 10px}.chs{display:flex;flex-wrap:wrap;gap:8px}.e{background:#ffffff22;padding:8px 14px}#pn .row{padding:8px 0 14px}#br{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:8;padding-top:env(safe-area-inset-top,0px)}#br.on{display:flex}#brh{display:flex;gap:8px;padding:14px 4vw 8px}#q{flex:1}#chips{display:flex;gap:8px;overflow-x:auto;padding:4px 4vw 8px;scrollbar-width:none}.ch{flex:0 0 auto;background:#ffffff22}.ch.cur{background:var(--ac)}#flt{display:flex;gap:8px;padding:0 4vw 8px}#flt select{flex:1;min-width:0;padding:10px;border-radius:8px;border:1px solid #444;background:#0b0d12;color:var(--tx);font:inherit}#brs{flex:1;overflow-y:auto;padding:6px 4vw 40px}#bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}#bg .card{width:100%}#vb:fullscreen,#vb:-webkit-full-screen{height:100%;width:100%}video.cover{object-fit:cover}#tp button{padding:8px 11px}#bfit.cur{background:var(--ac)}.all{font-size:13px;padding:4px 10px;margin-left:8px;vertical-align:middle}*{-webkit-tap-highlight-color:transparent}button,.f{touch-action:manipulation}#pn,#brs,.row,#chips{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.card img.pi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.lite *{transition:none!important;animation:none!important}.lite .f:focus{transform:none;outline-width:4px}#bg .card{content-visibility:auto;contain-intrinsic-size:110px 165px}.sk{background:#1a1e29}#ad{position:fixed;inset:0;background:#000d;display:none;z-index:10;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 0}#ad.on{display:flex}#asl{display:grid;gap:8px}textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #444;background:#0b0d12;color:var(--tx);font:inherit}</style></head><body>
<header><div class="logo">PHIM</div><div><button class="f" id="sbtn">🔍 Tìm phim</button> <button class="f" id="gear">⚙ API</button></div></header>
<section class="hero" id="hero"></section>

<h2>Đang xem</h2><div class="row" id="watch"></div>

<h2>Phim lẻ <button class="f all" data-all="phim-le">Xem tất cả ›</button></h2><div class="row" id="rle"></div>
<h2>Hoạt hình <button class="f all" data-all="hoat-hinh">Xem tất cả ›</button></h2><div class="row" id="rhh"></div>

<div id="br"><div id="brh"><input id="q" class="f" type="search" placeholder="Tìm phim theo tên…" enterkeyhint="search"><button class="f" id="qs">🔍</button><button class="f" id="qx">✕</button></div>
<div id="chips"></div><div id="flt"><select id="sc" class="f"><option value="">Thể loại</option></select><select id="sn" class="f"><option value="">Quốc gia</option></select></div>
<div id="brs"><div id="bg"></div><div id="bm" class="note"></div><button class="f" id="more" style="display:none;margin:8px 0">Xem thêm</button></div></div>
<div id="ad"><div class="box"><h3 id="adt" style="margin:0">Thêm phim</h3>
<label>Tên phim *</label><input id="an" class="f">
<label>Link poster (ảnh)</label><input id="ap" class="f" inputmode="url" placeholder="https://…/poster.jpg">
<label>Nội dung phim</label><textarea id="ac" class="f" rows="4"></textarea>
<label>Năm phát hành</label><input id="ay" class="f" inputmode="numeric" placeholder="2026">
<label>Số mùa</label><input id="as" class="f" type="number" min="1" max="20" value="1">
<div id="asl"></div><div id="ainfo" class="note" style="margin:0"></div>
<div style="display:flex;gap:10px"><button class="f" id="asave" style="background:var(--ac)">Lưu phim</button><button class="f" id="acan">Hủy</button></div></div></div>
<div id="set"><div class="box">
<h3 style="margin:0">Cài đặt API</h3>
<label>Địa chỉ API</label><input id="api" placeholder="https://phimapi.com">
<label>Đường dẫn danh sách phim mới</label><input id="path" placeholder="/danh-sach/phim-moi-cap-nhat?page=1">
<label>Tiền tố ảnh (nếu poster là đường dẫn tương đối)</label><input id="img" placeholder="https://phimimg.com/">
<div style="display:flex;gap:10px"><button class="f" id="save">Lưu &amp; tải</button><button class="f" id="close">Đóng</button></div>
</div></div>
<div id="pl"><div id="vb"><video id="v" autoplay playsinline></video><iframe id="fr" allowfullscreen allow="autoplay; fullscreen" style="display:none;border:0"></iframe><div id="sp">Đang tải…</div>
<div id="ov"><div id="tp"><div id="ti"></div><button class="f" id="bpip" title="Cửa sổ nhỏ">▣</button><button class="f" id="bfit" title="Thu phóng">⤢</button><button class="f" id="bfs" title="Toàn màn hình">⛶</button><button class="f" id="qb">⚙ Tự động</button><button class="f" id="bx">✕</button></div>
<div class="cc"><button class="f cb" id="bb">↺10</button><button class="f cb big" id="bp">▶</button><button class="f cb" id="bf">10↻</button></div>
<div id="bt"><div id="pb" class="f" tabindex="0"><i id="pf"></i></div><div id="tm" class="note" style="margin:6px 0 0"></div></div></div>
<div id="qm"></div></div><div id="pn"></div></div>

<script>
const $=id=>document.getElementById(id);
const LITE=/Android TV|SMART-TV|SmartTV|Tizen|Web0S|WebOS|BRAVIA|AFTM|AFTT|CrKey|GoogleTV|Hisense|VIDAA|NetCast|HbbTV/i.test(navigator.userAgent)||(navigator.deviceMemory&&navigator.deviceMemory<=2)||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=2);
if(LITE)document.documentElement.classList.add('lite');
const S={api:'https://phimapi.com',path:'/danh-sach/phim-moi-cap-nhat?page=1',img:'https://phimimg.com/'};
let watching=[],hls=null,cur=null;
try{Object.assign(S,JSON.parse(localStorage.getItem('phim_cfg')||'{}'));watching=JSON.parse(localStorage.getItem('phim_watch')||'[]')}catch(e){}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bg=u=>u?`background-image:url('${esc(u)}')`:'';
const demo=[...Array(12)].map((_,i)=>({name:'Phim mẫu '+(i+1),slug:'demo'+i,year:2026,poster:'',demo:1}));
let PI='';function imgUrl(p){if(!p)return'';if(/^https?:/.test(p))return p;if(PI&&!/\//.test(p))return PI+p;return S.img+(/\//.test(p)?'':'uploads/movies/')+p.replace(/^\//,'')}
function norm(j){PI=j.pathImage||'';const a=j.items||(j.data&&j.data.items)||j.data||[];
 return(Array.isArray(a)?a:[]).map(x=>{const r=x.poster_url||x.thumb_url||x.poster||'',bare=r&&!/^https?:/.test(r)&&!/\//.test(r)&&!PI;return{name:x.name||x.title,slug:x.slug,year:x.year,poster:bare?'':imgUrl(r),bare:!!bare}})}
const thumb=(u,w)=>u&&/^https?:/.test(u)&&!/wsrv\.nl/.test(u)?'https://wsrv.nl/?url='+encodeURIComponent(u)+'&w='+w+'&output=webp&q=70&we':u;
function setHero(u){const h=$('hero');if(!u)return;const t=thumb(u,900),im=new Image();
 im.onload=()=>h.style.backgroundImage="url('"+t+"')";im.onerror=()=>h.style.backgroundImage="url('"+u+"')";im.src=t}
function skel(){const h='<div class="card sk"></div>'.repeat(8);['latest','feat','rbo','rle','rhh'].forEach(id=>{const e=$(id);if(e&&!e.children.length)e.innerHTML=h})}
let hp=null;
function needHls(){if(window.Hls)return Promise.resolve();return hp||(hp=new Promise(r=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js';s.onload=s.onerror=()=>r();document.head.appendChild(s)}))}
function card(m,pct){const hue=(m.slug||'').length*37%360;
 return`<div class="card f" tabindex="0" data-s="${esc(m.slug)}"${m.bare?' data-b="1"':''} style="background-image:linear-gradient(160deg,hsl(${hue} 50% 30%),#111)">${m.poster?`<img class="pi" loading="lazy" decoding="async" alt="" src="${esc(thumb(m.poster,300))}" data-o="${esc(m.poster)}" onerror="if(this.dataset.o&&this.src!==this.dataset.o){this.src=this.dataset.o}else this.remove()">`:''}<span>${esc(m.name)}</span>${pct?`<i class="bar" style="width:${pct}%"></i>`:''}</div>`}
function render(list){
 window.L=list;
 const h=list[0]||{};
 $('hero').style='';setHero(h.poster);
 $('hero').innerHTML=`<div><h1>${esc(h.name)}</h1><p>${h.year?esc(h.year)+' · ':''}Phim nổi bật hôm nay</p><button class="f p" tabindex="0" data-s="${esc(h.slug)}">▶ Xem ngay</button></div>`;
 $('latest').innerHTML=list.map(m=>card(m)).join('');
 $('feat').innerHTML=list.slice(0,6).reverse().map(m=>card(m)).join('');obs($('latest'));obs($('feat'));
 renderWatch();
}
function renderWatch(){
 $('watch').innerHTML=watching.length?watching.map(m=>card(m,m.pct)).join(''):'<div class="note">Chưa có phim đang xem.</div>';
}
async function load(){skel();
 if(!S.api){render(demo);$('msg').textContent='Đang hiển thị dữ liệu mẫu. Bấm “⚙ API” để nhập API phim của bạn.';return}
 try{const c=JSON.parse(localStorage.getItem('phim_list')||'null');if(c&&c.k===S.api+S.path)render(c.l)}catch(e){}
 $('msg').textContent='Đang tải…';
 try{const r=await fetch(S.api.replace(/\/$/,'')+S.path);const l=norm(await r.json());
  if(!l.length)throw 0;render(l);setTimeout(loadRows,200);$('msg').textContent='';try{localStorage.setItem('phim_list',JSON.stringify({k:S.api+S.path,l}))}catch(e){}}
 catch(e){if(!window.L)render(demo);$('msg').textContent='Không tải được API. Kiểm tra địa chỉ rồi thử lại.'}
}
const DC={};let pt=null;setInterval(()=>{const k=Object.keys(DC);if(k.length>40)k.slice(0,k.length-40).forEach(x=>delete DC[x])},30000);
function detail(slug){return DC[slug]||(DC[slug]=fetch(S.api.replace(/\/$/,'')+'/phim/'+encodeURIComponent(slug)).then(r=>r.json()).catch(e=>{delete DC[slug];throw e}))}
document.addEventListener('focusin',e=>{const s=e.target.dataset&&e.target.dataset.s;if(s&&S.api&&!s.startsWith('demo')&&!s.startsWith('c_')){clearTimeout(pt);pt=setTimeout(()=>detail(s).catch(()=>{}),350)}});
let P=null,ht=null;
const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const plOn=()=>$('pl').classList.contains('on');
const txt=s=>{try{return(new DOMParser().parseFromString(s||'','text/html').body.textContent||'').trim()}catch(e){return''}};
function show(){const o=$('ov');o.classList.add('on');clearTimeout(ht);ht=setTimeout(()=>{if(!$('qm').classList.contains('on'))o.classList.remove('on')},4000)}
function icon(){$('bp').textContent=$('v').paused?'▶':'⏸'}
function save(){const v=$('v');if(!P)return;
 watching=[{slug:P.m.slug,name:P.info.name,poster:P.m.poster,year:P.info.year,i:P.i,t:v.currentTime||0,pct:v.duration?Math.round(v.currentTime/v.duration*100):0},...watching.filter(x=>x.slug!==P.m.slug)].slice(0,20);
 try{localStorage.setItem('phim_watch',JSON.stringify(watching))}catch(e){}}
function renderInfo(){const i=P.info;
 $('pn').innerHTML=`<h2 style="margin:0 0 4px">${esc(i.name)}</h2><div class="note" style="margin:0 0 6px">${esc([i.org,i.year,i.q,i.lang,i.time,i.cur].filter(Boolean).join(' · '))}</div>`
 +(i.cats?`<div class="note" style="margin:0 0 8px">${esc(i.cats)}</div>`:'')+`<p class="ds">${esc(i.content||'Chưa có nội dung phim.')}</p>`
 +(i.actors?`<div class="note" style="margin:0 0 6px">Diễn viên: ${esc(i.actors)}</div>`:'')+`${P.cid?'<div style="margin:8px 0"><button class="f" id="ped">✎ Sửa phim</button> <button class="f" id="pdl">🗑 Xóa phim</button></div>':''}<div id="eps"></div><h3>Phim khác</h3><div class="row" id="rel"></div>`;
 $('rel').innerHTML=(window.L||[]).filter(x=>x.slug!==P.m.slug).slice(0,20).map(m=>card(m)).join('')}
function nxt(d){if(!P)return -1;const s=P.eps[P.i].sv;for(let j=P.i+d;j>=0&&j<P.eps.length;j+=d)if(P.eps[j].sv===s)return j;return -1}
function buildEps(){$('eps').innerHTML=P.secs.map(s=>`<h3>${esc(s.h)} (${s.idx.length} tập)</h3><div class="chs">`+s.idx.map(i=>`<button class="f e${i===P.i?' cur':''}" data-i="${i}">${esc(P.eps[i].n)}</button>`).join('')+'</div>').join('')}
function buildQ(){const m=$('qm'),ok=hls&&hls.levels&&hls.levels.length>1;
 let h=`<button class="f q${P.q===-1?' cur':''}" data-q="-1">Tự động</button>`;
 if(ok)h+=hls.levels.map((l,i)=>({i,h:l.height||0})).sort((a,b)=>b.h-a.h).map(o=>`<button class="f q${P.q===o.i?' cur':''}" data-q="${o.i}">${o.h?o.h+'p':'Mức '+(o.i+1)}</button>`).join('');
 m.innerHTML=h;$('qb').textContent='⚙ '+(P.q===-1||!ok?'Tự động':(hls.levels[P.q].height||'?')+'p')}
function closeQ(){$('qm').classList.remove('on')}
function fail(){if(!P)return;const e=P.eps[P.i],v=$('v');clearTimeout(P.to);
 if(!P.nat&&e.u){P.nat=1;if(hls){hls.destroy();hls=null}v.src=e.u;v.load();v.play().catch(()=>{});buildQ();P.to=setTimeout(fail,12000);return}
 $('sp').classList.remove('on');
 if(e.e){v.pause();v.style.display='none';$('fr').style.display='block';$('fr').src=e.e}else $('ti').textContent='Không phát được tập này';show()}
function ep(i,t){
 P.i=i;P.nat=0;P.rec=0;P.q=-1;const e=P.eps[i],v=$('v'),fr=$('fr');
 if(hls){hls.destroy();hls=null}
 v.pause();$('pf').style.transform='scaleX(0)';closeQ();$('sp').classList.add('on');clearTimeout(P.to);P.to=setTimeout(fail,15000);
 $('ti').textContent=P.info.name+' — '+e.n+' ('+P.secs[e.s].h+')';buildEps();buildQ();show();
 if(!e.u){clearTimeout(P.to);v.style.display='none';fr.style.display='block';fr.src=e.e||'';$('sp').classList.remove('on');return}
 fr.style.display='none';fr.src='';v.style.display='block';
 const go=()=>{if(t)v.currentTime=t;v.play().catch(()=>{$('sp').classList.remove('on');$('ti').textContent=P.info.name+' — '+e.n+' (chạm ▶ để phát)';show()})};
 if(!/\.m3u8(\?|$)/i.test(e.u)){v.src=e.u;v.onloadedmetadata=go;v.onerror=fail;return}
 needHls().then(()=>{if(!P||P.i!==i)return;if(window.Hls&&Hls.isSupported()){hls=new Hls({startFragPrefetch:true,capLevelToPlayerSize:true,maxBufferLength:LITE?15:30,maxMaxBufferLength:LITE?30:60,maxBufferSize:(LITE?25:60)*1e6,backBufferLength:LITE?10:30,enableWorker:true,manifestLoadingMaxRetry:3,fragLoadingMaxRetry:4,fragLoadingRetryDelay:500});
  hls.loadSource(e.u);hls.attachMedia(v);
  hls.on(Hls.Events.MANIFEST_PARSED,()=>{buildQ();go()});
  hls.on(Hls.Events.ERROR,(_,d)=>{if(!d.fatal)return;if(d.type==='mediaError'&&!P.rec){P.rec=1;hls.recoverMediaError()}else fail()})}
 else{v.src=e.u;v.onloadedmetadata=go;v.onerror=fail}})
}
async function play(slug){
 if(String(slug).startsWith('c_'))return playMy(slug);
 if(String(slug).startsWith('demo')){$('msg').textContent='Đây là phim mẫu. Hãy nhập API để xem phim thật.';return}
 if(P)save();
 const m=(window.L||[]).find(x=>x.slug===slug)||watching.find(x=>x.slug===slug)||{slug,name:slug};
